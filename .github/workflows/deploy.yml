# ============================================================
# deploy.yml  -  the CI/CD pipeline for the Document Loading Agent
#
# What it does, in order (the numbers match the agreed list):
#   1-2. The developer builds and tests on DEV by hand, exports
#        the application to apex/f300.sql, commits and pushes.
#   3. CHECK   runs by itself on every push to main and on every
#              release: every db script has a header block, and
#              SQLcl can log in to PRD with the three secrets.
#              A push stops here. Production is never asked.
#   RELEASE    a person publishes a GitHub release with a version
#              number (v1.0, v1.1, ...) and notes saying what is in
#              it. Only a release goes on to steps 4 and 5.
#   4. WAIT    the "deploy" job targets the GitHub environment PRD,
#              which has a required reviewer; GitHub pauses here
#              until that person clicks Approve.
#   5. DEPLOY  Liquibase (inside SQLcl) runs the database scripts
#              listed in db/deploy/changelog.xml that are not yet in
#              its ledger (on an empty PRD: all of them), then
#              db/deploy/recompile.sql (invalid DLA objects), then
#              db/deploy/apex_import.sql (application 300 from
#              apex/f300.sql, automation re-enabled), then
#              db/deploy/verify.sql. Any error fails the run.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   PRD_WALLET_BASE64  the PRD wallet zip as base64 text
#   PRD_DB_USER        WKSP_WKSPPRDWORKSPACE
#   PRD_DB_PASSWORD    that user's password
# GitHub blanks these out of every log. No secret is in any file.
#
# Environment : PRD (GHAPEXAPPS_ATP_PRD). DEV is never deployed to
#               by the pipeline; DEV is where the work is done by hand.
# Author      : Claude for Gary D. Hall, 11/24/2026
# Changed     : 11/24/2026 - target moved from DEV (the proving run)
#               to PRD. The first-run changelog-sync is gone: PRD
#               starts empty, so every script must really run.
#               Evening: the Liquibase step now fails when the ledger
#               is short (Liquibase stopping early returned exit 0).
#               Night: production is deployed only from a published
#               release; a push to main runs the check and stops.
# ============================================================

name: Deploy to PRD

# When to run: on every push to the main branch.
on:
  # A push to main: step 3 (check) only.
  push:
    branches: [main]
    # A push that changes ONLY files on this list does not start this
    # pipeline: the relay (built by build-relay.yml, not deployed to
    # the database) and documents (the build log, the README, docs and
    # sample invoices), which are never installed anywhere. A push that
    # also changes anything else still starts it.
    paths-ignore:
      - 'relay/**'
      - '.github/workflows/build-relay.yml'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - 'samples/**'
  # A published release: step 3, then steps 4 and 5 (deploy to PRD).
  release:
    types: [published]

# Values that are not secrets but differ per environment.
env:
  APEX_WORKSPACE: PRD_WORKSPACE   # where application 300 is installed

jobs:

  # ---------------------------------------------------------
  # Step 3: CHECK
  # ---------------------------------------------------------
  check:
    name: "3. Check scripts and connection"
    runs-on: ubuntu-latest          # GitHub's own Linux computer
    steps:

      # Get a copy of the repository onto that computer.
      - name: Get the repository files
        uses: actions/checkout@v6

      # Every .sql under db/ must say "Script" in its first 5 lines
      # (the header block every script in this project carries).
      - name: Every db script has a header block
        run: |
          bad=0
          for f in $(find db -name '*.sql' | sort); do
            if head -5 "$f" | grep -q 'Script'; then
              echo "ok       $f"
            else
              echo "MISSING  $f"; bad=1
            fi
          done
          exit $bad

      # Install SQLcl (and the Java it needs) on that computer.
      - name: Install SQLcl
        uses: gvenzl/setup-oracle-sqlcl@v1

      # Turn the wallet secret back into the zip file, in a temp folder.
      - name: Write the PRD wallet
        run: echo "${{ secrets.PRD_WALLET_BASE64 }}" | base64 -d > "$RUNNER_TEMP/wallet.zip"

      # Log in to PRD and run one harmless query. If this fails,
      # a secret is wrong; nothing has been changed.
      - name: SQLcl can log in to PRD
        env:
          DB_USER: ${{ secrets.PRD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PRD_DB_PASSWORD }}
        run: |
          ALIAS=$(unzip -p "$RUNNER_TEMP/wallet.zip" tnsnames.ora | grep -o '^[A-Za-z0-9_]*_low' | head -1)
          echo "Connecting with alias $ALIAS"
          sql -S /nolog <<EOF
          set cloudconfig $RUNNER_TEMP/wallet.zip
          connect $DB_USER/"$DB_PASSWORD"@$ALIAS
          whenever sqlerror exit failure
          select 'CONNECTED as ' || user || ' on ' || sys_context('userenv','db_name') as result from dual;
          exit
          EOF

  # ---------------------------------------------------------
  # Step 4 (the pause) and Step 5: DEPLOY and VERIFY
  # ---------------------------------------------------------
  deploy:
    name: "5. Deploy to PRD and verify"
    needs: check                    # only after step 3 passed
    if: github.event_name == 'release'   # only a published release deploys
    runs-on: ubuntu-latest
    environment: PRD                # step 4: waits for the PRD reviewer
    steps:

      - name: Get the repository files
        uses: actions/checkout@v6

      - name: Install SQLcl
        uses: gvenzl/setup-oracle-sqlcl@v1

      - name: Write the PRD wallet
        run: echo "${{ secrets.PRD_WALLET_BASE64 }}" | base64 -d > "$RUNNER_TEMP/wallet.zip"

      # Liquibase: run the install scripts that are not yet in the
      # ledger (table DATABASECHANGELOG), plus re-runnable scripts whose
      # file changed. The list is db/deploy/changelog.xml.
      # On the first PRD run the ledger does not exist: Liquibase
      # creates it and runs all the scripts, in order. Afterwards the
      # ledger row count must equal the changeSet count, or the step
      # fails before the application import.
      - name: Liquibase update on PRD
        env:
          DB_USER: ${{ secrets.PRD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PRD_DB_PASSWORD }}
        run: |
          ALIAS=$(unzip -p "$RUNNER_TEMP/wallet.zip" tnsnames.ora | grep -o '^[A-Za-z0-9_]*_low' | head -1)
          EXPECTED=$(grep -c '<changeSet ' db/deploy/changelog.xml)
          sql -S /nolog <<EOF
          set cloudconfig $RUNNER_TEMP/wallet.zip
          connect $DB_USER/"$DB_PASSWORD"@$ALIAS
          lb update -changelog-file db/deploy/changelog.xml
          set serveroutput on
          whenever sqlerror exit failure
          -- Liquibase stopping early does not fail the step by itself
          -- (run 6 proved that), so count the ledger: one row per
          -- changeSet, or this step fails here and nothing else runs.
          declare
              l_rows number;
          begin
              select count(*) into l_rows from databasechangelog;
              if l_rows <> $EXPECTED then
                  raise_application_error(-20200, 'Liquibase stopped early: ledger has ' || l_rows || ' rows, changelog.xml has $EXPECTED changeSets. Read the Liquibase output above.');
              end if;
              dbms_output.put_line('Ledger complete: ' || l_rows || ' of $EXPECTED');
          end;
          /
          exit
          EOF

      # A table change marks the packages that use the table INVALID.
      # Recompile every invalid DLA object now, so verify sees the
      # true state (run 8: DLA_19 added columns, DLA_PKG went INVALID).
      - name: Recompile invalid DLA objects
        env:
          DB_USER: ${{ secrets.PRD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PRD_DB_PASSWORD }}
        run: |
          ALIAS=$(unzip -p "$RUNNER_TEMP/wallet.zip" tnsnames.ora | grep -o '^[A-Za-z0-9_]*_low' | head -1)
          sql -S /nolog <<EOF
          set cloudconfig $RUNNER_TEMP/wallet.zip
          connect $DB_USER/"$DB_PASSWORD"@$ALIAS
          @db/deploy/recompile.sql
          exit
          EOF

      # Import the APEX application from apex/f300.sql and switch the
      # automation back on (APEX disables automations on import).
      - name: Import application 300 from apex/f300.sql
        env:
          DB_USER: ${{ secrets.PRD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PRD_DB_PASSWORD }}
        run: |
          ALIAS=$(unzip -p "$RUNNER_TEMP/wallet.zip" tnsnames.ora | grep -o '^[A-Za-z0-9_]*_low' | head -1)
          sql -S /nolog <<EOF
          set cloudconfig $RUNNER_TEMP/wallet.zip
          connect $DB_USER/"$DB_PASSWORD"@$ALIAS
          define apex_workspace = $APEX_WORKSPACE
          @db/deploy/apex_import.sql
          exit
          EOF

      # Verify: zero invalid DLA objects, application present,
      # automation ACTIVE, Liquibase ledger complete, or the run fails.
      - name: Verify PRD
        env:
          DB_USER: ${{ secrets.PRD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PRD_DB_PASSWORD }}
        run: |
          ALIAS=$(unzip -p "$RUNNER_TEMP/wallet.zip" tnsnames.ora | grep -o '^[A-Za-z0-9_]*_low' | head -1)
          EXPECTED=$(grep -c '<changeSet ' db/deploy/changelog.xml)
          sql -S /nolog <<EOF
          set cloudconfig $RUNNER_TEMP/wallet.zip
          connect $DB_USER/"$DB_PASSWORD"@$ALIAS
          define expected_changesets = $EXPECTED
          define apex_workspace = $APEX_WORKSPACE
          @db/deploy/verify.sql
          exit
          EOF
